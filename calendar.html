        <button class="icon-btn" type="button" aria-label="Warenkorb öffnen">

  <main>
    <div class="content">
      <h1>Wähle dein Zeitraum</h1>

      <div class="card">
        <div class="calendar" id="calendar" aria-label="Datumsbereich auswählen"></div>

        <p class="date-summary" id="dateSummary" aria-live="polite" hidden>
          <span id="dateText"></span>
        </p>

        <button class="btn-continue" id="btnContinue" type="button" disabled>
          Datum Auswählen
        </button>
      </div>
    </div>
  </main>

  <footer>
    <nav class="footer-inner">
      <a href="#impressum">Impressum</a>
      <a href="#datenschutz">Datenschutzbestimmung</a>
      <a href="#agb">AGB</a>
    </nav>
  </footer>

<script>
(function() {
  const DE_MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const DE_DAYS_SHORT = ['Mo','Di','Mi','Do','Fr','Sa','So'];

  let currentYear = 2026;
  let currentMonth = 5; // 0-indexed: June

  // Default selection: June 1–7, 2026
  let rangeStart = new Date(2026, 5, 1);
  let rangeEnd   = new Date(2026, 5, 7);
  let selecting  = false; // true after first click, waiting for end

  function toMidnight(d) {
    const r = new Date(d); r.setHours(0,0,0,0); return r;
  }

  function pad2(n) { return String(n).padStart(2,'0'); }

  function formatDate(d) {
    return pad2(d.getDate()) + '.' + pad2(d.getMonth()+1) + '.' + d.getFullYear();
  }

  function isSameDay(a, b) {
    return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  function inRange(d, s, e) {
    return d > s && d < e;
  }

  function render() {
    const container = document.getElementById('calendar');
    const today = toMidnight(new Date());

    const firstDay = new Date(currentYear, currentMonth, 1);
    const lastDay  = new Date(currentYear, currentMonth+1, 0);

    // ISO week: Mon=0..Sun=6
    let startDow = (firstDay.getDay() + 6) % 7;

    let html = '<div class="cal-header">';
    html += `<button class="cal-nav prev" id="prevMonth">&#8249;</button>`;
    html += `<span class="cal-title">${DE_MONTHS[currentMonth]} ${currentYear}</span>`;
    html += `<button class="cal-nav next" id="nextMonth">&#8250;</button>`;
    html += '</div>';

    html += '<table class="cal-grid"><thead><tr>';
    DE_DAYS_SHORT.forEach(d => { html += `<th>${d}</th>`; });
    html += '</tr></thead><tbody>';

    let day = 1;
    const totalDays = lastDay.getDate();

    for (let row = 0; row < 6; row++) {
      if (day > totalDays) break;
      html += '<tr>';
      for (let col = 0; col < 7; col++) {
        const cellIndex = row * 7 + col;
        if (cellIndex < startDow || day > totalDays) {
          // Outside current month
          const outsideDate = cellIndex < startDow
            ? new Date(currentYear, currentMonth, 1 - (startDow - cellIndex))
            : new Date(currentYear, currentMonth+1, day - totalDays);
          outsideDate.setHours(0,0,0,0);

          let cellClass = '';
          let btnClass = 'day-btn outside';

          if (rangeStart && rangeEnd) {
            const s = toMidnight(rangeStart), e = toMidnight(rangeEnd);
            if (isSameDay(outsideDate, s)) { btnClass += ' range-start'; cellClass = 'range-start-cell'; }
            else if (isSameDay(outsideDate, e)) { btnClass += ' range-end'; cellClass = 'range-end-cell'; }
            else if (inRange(outsideDate, s, e)) { btnClass += ' range-mid'; cellClass = 'range-mid-cell'; }
          }

          html += `<td class="${cellClass}"><button class="${btnClass}" data-ts="${outsideDate.getTime()}">${outsideDate.getDate()}</button></td>`;
        } else {
          const thisDate = new Date(currentYear, currentMonth, day);
          thisDate.setHours(0,0,0,0);

          let btnClass = 'day-btn';
          let cellClass = '';

          if (isSameDay(thisDate, today)) btnClass += ' today';

          if (rangeStart && rangeEnd) {
            const s = toMidnight(rangeStart), e = toMidnight(rangeEnd);
            if (isSameDay(thisDate, s)) { btnClass += ' range-start'; cellClass = 'range-start-cell'; }
            else if (isSameDay(thisDate, e)) { btnClass += ' range-end'; cellClass = 'range-end-cell'; }
            else if (inRange(thisDate, s, e)) { btnClass += ' range-mid'; cellClass = 'range-mid-cell'; }
          } else if (rangeStart && !rangeEnd) {
            if (isSameDay(thisDate, rangeStart)) { btnClass += ' range-start'; }
          }

          html += `<td class="${cellClass}"><button class="${btnClass}" data-ts="${thisDate.getTime()}">${day}</button></td>`;
          day++;
        }
      }
      html += '</tr>';
      // advance day past outside cells at start
      if (row === 0 && startDow > 0) { /* already handled */ }
    }

    html += '</tbody></table>';
    container.innerHTML = html;

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      render();
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      render();
    });

    container.querySelectorAll('.day-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const ts = parseInt(btn.dataset.ts, 10);
        const clicked = new Date(ts);
        clicked.setHours(0,0,0,0);

        if (!selecting || !rangeStart) {
          rangeStart = clicked;
          rangeEnd = null;
          selecting = true;
        } else {
          if (clicked < rangeStart) {
            rangeEnd = rangeStart;
            rangeStart = clicked;
          } else if (isSameDay(clicked, rangeStart)) {
            rangeEnd = clicked;
          } else {
            rangeEnd = clicked;
          }
          selecting = false;
        }
        updateSummary();
        render();
      });
    });
  }

  function updateSummary() {
    const summary = document.getElementById('dateSummary');
    const text    = document.getElementById('dateText');
    const btn     = document.getElementById('btnContinue');

    if (rangeStart && rangeEnd) {
      summary.hidden = false;
      text.innerHTML = `<strong>Von:</strong> <time datetime="${rangeStart.toISOString().slice(0,10)}">${formatDate(rangeStart)}</time> &rarr; <strong>Bis:</strong> <time datetime="${rangeEnd.toISOString().slice(0,10)}">${formatDate(rangeEnd)}</time>`;
      btn.disabled = false;
      btn.removeAttribute('aria-disabled');
    } else {
      summary.hidden = true;
      btn.disabled = true;
      btn.setAttribute('aria-disabled', 'true');
    }
  }

  render();
  updateSummary();

  document.getElementById('btnContinue').addEventListener('click', () => {
    if (rangeStart && rangeEnd) {
      const params = new URLSearchParams({
        from: rangeStart.getTime(),
        to:   rangeEnd.getTime(),
      });
      location.href = 'products.html?' + params.toString();
    }
  });
})();
</script>
</body>
</html>
